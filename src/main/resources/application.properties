# =============================================================
# Food Co-op Ordering System - default configuration
# Deployment configuration is externalized: every environment
# specific value can be overridden with an environment variable,
# so the same artifact runs in dev, test and production.
# =============================================================

server.port=${SERVER_PORT:8080}

# --- Database (override via environment variables in production) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_coop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Seed data (data.sql runs on every startup, insert is idempotent) ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- Logging ---
logging.level.root=INFO
logging.level.com.foodcoop=DEBUG
